name: Rocland CI/CD Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: 

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: 1. Descargar el código más reciente
        uses: actions/checkout@v4

      - name: 2. Detener versión anterior
        run: docker-compose down || true

      - name: 3. Construir y levantar nueva versión
        run: docker-compose up -d --build

      - name: 4. Limpiar imágenes viejas
        run: docker image prune -f
